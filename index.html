<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MCU Watch Tracker</title>
  <meta name="description" content="Track every Marvel live-action film and series you've watched — the MCU, Marvel TV, and the Fox and Sony films." />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23e23636'/%3E%3Cpath d='M38 28 L74 50 L38 72 Z' fill='white'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="img/icon-180.png?v=1" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MCU" />
  <link rel="stylesheet" href="css/styles.css?v=1" />
</head>
<body>
  <div class="navbar">
    <div class="navbar-inner">
      <span class="navbar-badge"><svg viewBox="0 0 100 100" width="12" height="12" xmlns="http://www.w3.org/2000/svg"><path d="M30 18 L84 50 L30 82 Z" fill="white"/></svg></span>
      <span class="navbar-title">MCU Watch Tracker</span>
      <a class="navbar-link" href="order.html">Watch Order</a>
    </div>
  </div>

  <main class="screen">
    <div class="large-title-block">
      <h1 class="large-title">MCU Watch<br />Tracker</h1>
      <p class="large-subtitle">Everything Marvel, in live action</p>
    </div>

    <div class="segmented" id="category-segmented"></div>

    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-label" id="progress-label">0 of 0 seen</span>
    </div>

    <div class="search-wrap">
      <input type="search" id="search" class="search-input" placeholder="Search titles, years, phases, studios" autocomplete="off" />
    </div>

    <div class="toolbar-row">
      <button type="button" id="sort-toggle" class="toolbar-btn">Release Order</button>
      <button type="button" id="mark-all-seen" class="toolbar-btn">Mark All Seen</button>
      <button type="button" id="clear-all-seen" class="toolbar-btn">Clear All</button>
    </div>

    <p class="category-note hidden" id="category-note"></p>

    <section class="ios-group">
      <ul class="ios-list" id="titles-list"></ul>
    </section>

    <p class="page-footer">Fan-made tracker. Not affiliated with Marvel or Disney. Your checkmarks are saved in this browser only.</p>
  </main>

  <!-- Bump every ?v= below (including the stylesheet in <head>, the
       matching tags in the other page, and APP_SHELL in sw.js) on any
       deploy that touches css/js — GitHub Pages and mobile browsers can
       otherwise keep serving stale cached files after a redeploy. -->
  <script src="js/data.js?v=1"></script>
  <script src="js/shared.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then((reg) => reg.update());
      });
      // A new service worker (skipWaiting + clients.claim, both already
      // in sw.js) takes over silently — reload once so an already-open
      // tab/installed app picks up the update instead of running stale JS.
      let reloadedForNewSw = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloadedForNewSw) return;
        reloadedForNewSw = true;
        window.location.reload();
      });
    }
  </script>
</body>
</html>
