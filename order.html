  <link rel="apple-touch-icon" href="img/icon-180.png?v=2" />

</head>
<body>
  <div class="navbar">
    <div class="navbar-inner">
      <span class="navbar-badge"><svg viewBox="0 0 100 100" width="12" height="12" xmlns="http://www.w3.org/2000/svg"><path d="M30 18 L84 50 L30 82 Z" fill="white"/></svg></span>
      <span class="navbar-title">MCU Watch Tracker</span>
    </div>
  </div>

  <main class="screen">
    <div class="large-title-block">
      <h1 class="large-title">MCU<br />Order</h1>
      <p class="large-subtitle">The Marvel Studios saga, start to finish</p>
    </div>

    <div class="segmented" id="order-segmented"></div>

    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-label" id="progress-label">0 of 0 seen</span>
    </div>

    <div class="up-next" id="up-next"></div>

    <div class="toolbar-row">
      <button type="button" id="hide-seen-toggle" class="toolbar-btn">Hide Watched</button>
    </div>

    <p class="category-note" id="order-note"></p>

    <section class="ios-group">
      <ul class="ios-list" id="order-list"></ul>
    </section>

    <p class="page-footer">Tap a series to track it episode by episode. Fan-made tracker. Not affiliated with Marvel or Disney.</p>
  </main>

  <nav class="tabbar">
    <div class="tabbar-inner">
      <a class="tab" href="index.html"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>Master List</span></a>

      <a class="tab active" aria-current="page" href="order.html"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 4.5v15l12-7.5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>MCU Order</span></a>
    </div>
  </nav>

  <!-- Bump every ?v= below (including the stylesheet in <head>, the
       matching tags in the other page, and APP_SHELL in sw.js) on any
       deploy that touches css/js — GitHub Pages and mobile browsers can
       otherwise keep serving stale cached files after a redeploy. -->
  <script src="js/data.js?v=2"></script>
  <script src="js/shared.js?v=2"></script>
  <script src="js/order.js?v=2"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then((reg) => reg.update());
      });
      // A new service worker (skipWaiting + clients.claim, both already
      // in sw.js) takes over silently — reload once so an already-open
      // tab/installed app picks up the update instead of running stale JS.
      let reloadedForNewSw = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloadedForNewSw) return;
        reloadedForNewSw = true;
        window.location.reload();
      });
    }
  </script>
</body>
</html>
